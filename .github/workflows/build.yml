name: Build Creative Durability

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: creativedurability-jar
          path: build/libs/*.jar
          if-no-files-found: error
